      document.getElementById("btnCounterCancel").innerText = t('btn_cancel');
      document.getElementById("btnCounterSave").innerText = t('btn_add');

      // Category Modal
      document.getElementById("lblCatModalTitle").innerText = t('category_modal_title');
      document.getElementById("lblCatName").innerText = t('category_name_label');
      document.getElementById("lblCatIcon").innerText = t('category_icon_label');
      document.getElementById("lblCatColor").innerText = t('category_color_label');
      document.getElementById("btnCatCancel").innerText = t('btn_cancel');
      document.getElementById("btnCatSave").innerText = t('btn_create');

      // Dropdown chọn ngôn ngữ
      document.getElementById("langSelect").value = currentLang;
    }

    function changeLanguage(lang) {
      if (!I18N[lang]) return;
      currentLang = lang;
      localStorage.setItem("app_lang", lang);
      document.documentElement.lang = lang;
      buildStatusMap();
      renderAllSelects();
      applyTranslationsToUI();
      renderCurrentView();
    }

    // Khởi tạo ban đầu
    document.documentElement.lang = currentLang;
    buildStatusMap();
    renderDynamicStyles();
    renderAllSelects();
    applyTranslationsToUI();

    let currentDate = new Date();
    let eventsData = JSON.parse(localStorage.getItem("calendar_events") || "{}");
    let selectedDateKey = null;

    function toggleMenu() {
      document.getElementById("menuOverlay").classList.toggle("active");
      document.getElementById("menuDrawer").classList.toggle("active");
    }

    if (auth) {
      auth.onAuthStateChanged(user => {
        currentUser = user;
        const userInfoDiv = document.getElementById("userInfo");
        const authBtn = document.getElementById("authBtn");

        if (user) {
          userInfoDiv.innerHTML = `
            <img src="${user.photoURL || 'https://via.placeholder.com/32'}" class="user-avatar" />
            <span>${escapeHtml(user.displayName || user.email)}</span>
          `;
          authBtn.innerText = t('btn_logout');
          authBtn.style.background = "#ef4444";
          listenToCloudChanges(user.uid);
        } else {
          userInfoDiv.innerHTML = `<span id="lblUserOffline">${t('offline_user')}</span>`;
          authBtn.innerText = t('btn_login');
          authBtn.style.background = "var(--primary)";
          if (unsubscribeSnapshot) unsubscribeSnapshot();
        }
      });
    }

    function handleAuth() {
      if (!auth) return;
      if (currentUser) {
        auth.signOut();
      } else {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(error => {
          if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user') {
            auth.signInWithRedirect(provider);
          } else {
            alert("Lỗi đăng nhập: " + error.message);
          }
        });
      }
    }

    function listenToCloudChanges(uid) {
      if (!db) return;
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      const userDocRef = db.collection("users").doc(uid);
      unsubscribeSnapshot = userDocRef.onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          eventsData = data.events || {};
          
          if (data.categories) {
            customCategories = data.categories;
            localStorage.setItem("custom_categories", JSON.stringify(customCategories));
            buildStatusMap();
            renderDynamicStyles();
            renderAllSelects();
          }
          if (data.counters) {
            userCounters = data.counters;
            localStorage.setItem("user_counters", JSON.stringify(userCounters));
          }

          localStorage.setItem("calendar_events", JSON.stringify(eventsData));
          renderCurrentView();
        } else {
          userDocRef.set({ events: eventsData, categories: customCategories }, { merge: true });
        }
      }, err => console.log("Lỗi snapshot:", err));
    }

    function saveToStorage() {
      localStorage.setItem("calendar_events", JSON.stringify(eventsData));
      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).set({
          events: eventsData,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => console.error("Lỗi đồng bộ Cloud:", err));
      }
    }

    function saveCategoriesToStorage() {
      localStorage.setItem("custom_categories", JSON.stringify(customCategories));
      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).set({
          categories: customCategories,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => console.error("Lỗi đồng bộ Cloud Categories:", err));
      }
    }

    function toggleTheme() {
      const isDark = document.body.getAttribute("data-theme") === "dark";
      document.body.setAttribute("data-theme", isDark ? "light" : "dark");
      localStorage.setItem("theme", isDark ? "light" : "dark");
    }

    if (localStorage.getItem("theme") === "dark") {
      document.body.setAttribute("data-theme", "dark");
    }

    function saveCountersToStorage() {
      localStorage.setItem("user_counters", JSON.stringify(userCounters));
      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).set({
          counters: userCounters,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => console.error("Lỗi đồng bộ Cloud Counters:", err));
      }
    }

    function openAddCounterModal() {
      toggleMenu();
      document.getElementById("addCounterModal").classList.add("active");
    }
    function closeAddCounterModal() {
      document.getElementById("addCounterModal").classList.remove("active");
    }
    function saveCounter() {
      const mode = document.getElementById("counterMode").value;
      const cat = document.getElementById("counterCategory").value;
      userCounters.push({ mode: mode, category: cat, id: Date.now() });
      saveCountersToStorage();
      closeAddCounterModal();
      renderCounters();
    }
    function deleteCounter(index) {
      if (confirm(t('confirm_del_counter'))) {
        userCounters.splice(index, 1);
        saveCountersToStorage();
        renderCounters();
      }
    }

    function renderCounters() {
      const container = document.getElementById("countersContainer");
      if (!container) return;
      container.innerHTML = "";
      
      if (userCounters.length === 0) {
        container.style.display = "none";
        return;
      }
      container.style.display = "flex";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const totalDays = new Date(year, month + 1, 0).getDate();

      let today = new Date();
      today.setHours(0,0,0,0);

      userCounters.forEach((counter, index) => {
        const cat = counter.category;
        const mode = counter.mode;
        const statusInfo = statusMap[cat] || statusMap.empty;
        const hexColor = statusInfo.hex || statusInfo.color || "#8FABD4";

        let valueText = "";
        
        if (mode === "countdown") {
          let daysLeft = -1;
          for(let i = 0; i <= 365; i++) {
            let d = new Date(today);
            d.setDate(today.getDate() + i);
            let dk = formatDateKey(d.getFullYear(), d.getMonth(), d.getDate());
            let rawData = eventsData[dk] || { type1: "empty", type2: "none" };
            let t1 = rawData.type1 || rawData.type || "empty";
            let t2 = rawData.type2 || "none";
            
            if (t1 === cat || t2 === cat) {
              daysLeft = i;
              break;
            }
          }
          if (daysLeft === -1) valueText = t('no_event_found');
          else if (daysLeft === 0) valueText = t('today');
          else if (daysLeft === 1) valueText = t('tomorrow');
          else valueText = t('days_left', { n: daysLeft });
        } 
        else if (mode === "count_month") {
          let count = 0;
          for (let day = 1; day <= totalDays; day++) {
            let dk = formatDateKey(year, month, day);
            let rawData = eventsData[dk] || { type1: "empty", type2: "none" };
            let t1 = rawData.type1 || rawData.type || "empty";
            let t2 = rawData.type2 || "none";
            if (t1 === cat || t2 === cat) count++;
          }
          valueText = t('days_count', { n: count });
        }

        const titleText = mode === "countdown" ? t('countdown_title') : t('month_count_title');
        
        const widget = document.createElement("div");
        widget.className = "counter-widget";
        widget.style.borderLeftColor = hexColor;
        widget.innerHTML = `
          <button class="del-btn" onclick="deleteCounter(${index})" title="Xóa bộ đếm">✕</button>
          <div class="counter-title">${titleText}</div>
          <div class="counter-value">${valueText}</div>
          <div class="counter-cat"><span style="font-size:1.05rem">${statusInfo.icon}</span> <span style="color:${hexColor}">${statusInfo.text}</span></div>
        `;
        container.appendChild(widget);
      });
    }

    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCurrentView();
    }

    function formatDateKey(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    /* ========================================================
       TÍNH NĂNG 1: TỰ ĐỘNG CUỘN ĐẾN HÔM NAY & ĐIỀU HƯỚNG NGÀY
       ======================================================== */
    function scrollToToday(smooth = true) {
      const now = new Date();
      if (currentDate.getFullYear() !== now.getFullYear() || currentDate.getMonth() !== now.getMonth()) {
        return;
      }
      const todayKey = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());
      let targetEl = null;
      if (currentView === "grid") {
        targetEl = document.querySelector(".grid-day-cell.today");
      } else {
        targetEl = document.getElementById(`day-card-${todayKey}`) || document.querySelector(".day-card.today");
      }

      if (targetEl) {
        targetEl.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "center" });
        targetEl.classList.remove("today-highlight-flash");
        void targetEl.offsetWidth;
        targetEl.classList.add("today-highlight-flash");
        setTimeout(() => {
          targetEl.classList.remove("today-highlight-flash");
        }, 1800);
      }
    }

    function goToToday() {
      const now = new Date();
      const needChangeMonth = (currentDate.getFullYear() !== now.getFullYear() || currentDate.getMonth() !== now.getMonth());
      currentDate = new Date();
      if (needChangeMonth) {
        renderCurrentView();
      }
      setTimeout(() => {
        scrollToToday(true);
      }, needChangeMonth ? 180 : 50);
    }

    function goToDay(dateKey, y, m, d) {
      const needRender = (currentDate.getFullYear() !== y || currentDate.getMonth() !== m);
      if (needRender) {
        currentDate = new Date(y, m, 1);
        renderCurrentView();
      }
      setTimeout(() => {
        let target = null;
        if (currentView === "grid") {
          const cells = document.querySelectorAll(".grid-day-cell:not(.other-month)");
          if (cells[d - 1]) target = cells[d - 1];
        } else {
          target = document.getElementById(`day-card-${dateKey}`);
        }
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "center" });
          target.classList.remove("today-highlight-flash");
          void target.offsetWidth;
          target.classList.add("today-highlight-flash");
          setTimeout(() => target.classList.remove("today-highlight-flash"), 1800);
        }
      }, needRender ? 180 : 50);
    }

    /* ========================================================
       TÍNH NĂNG 2: TÓM TẮT LỊCH TRÌNH (NGÀY, TUẦN, THÁNG)
       ======================================================== */
    const ScheduleSummary = {
      currentTab: localStorage.getItem("summary_tab") || "day",
      isCollapsed: localStorage.getItem("summary_collapsed") === "true",

      init() {
        this.updateCollapseUI();
      },

      switchTab(tab) {
        this.currentTab = tab;
        localStorage.setItem("summary_tab", tab);
        if (this.isCollapsed) {
          this.isCollapsed = false;
          localStorage.setItem("summary_collapsed", "false");
          this.updateCollapseUI();
        }
        this.render();
      },

      toggleCollapse() {
        this.isCollapsed = !this.isCollapsed;
        localStorage.setItem("summary_collapsed", String(this.isCollapsed));
        this.updateCollapseUI();
      },

      updateCollapseUI() {
        const card = document.getElementById("scheduleSummaryCard");
        const icon = document.getElementById("summaryCollapseIcon");
        if (!card || !icon) return;
        if (this.isCollapsed) {
          card.classList.add("collapsed");
          icon.innerText = "▼";
        } else {
          card.classList.remove("collapsed");
          icon.innerText = "▲";
        }
      },

      render() {
        const container = document.getElementById("summaryBody");
        if (!container) return;

        ["day", "week", "month"].forEach(t => {
          const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}Btn`);
          if (btn) {
            if (t === this.currentTab) btn.classList.add("active");
            else btn.classList.remove("active");
          }
        });

        if (this.currentTab === "day") {
          this.renderDay(container);
        } else if (this.currentTab === "week") {
          this.renderWeek(container);
        } else if (this.currentTab === "month") {
          this.renderMonth(container);
        }
      },

      /* 1. Tóm tắt Hôm nay */
      renderDay(container) {
        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth();
        const d = now.getDate();
        const todayKey = formatDateKey(y, m, d);
        const rawData = eventsData[todayKey] || { type: "empty", note: "" };
        const type1 = rawData.type1 || rawData.type || "empty";
        const type2 = rawData.type2 || "none";
        const note = (rawData.note || "").trim();

        const dict = I18N[currentLang] || I18N.vi;
        const dayOfWeekIndex = now.getDay();
        const dayOfWeek = (dict.weekdays_full && dict.weekdays_full[dayOfWeekIndex]) || dict.weekdays[dayOfWeekIndex];
        const holidayName = getJapanHolidayName(y, m, d);

        const status1 = statusMap[type1] || statusMap.empty;
        const status2 = (type2 !== "none" && statusMap[type2]) ? statusMap[type2] : null;

        const formattedDate = dict.format_date_label ? dict.format_date_label(y, m, d) : `Ngày ${d}/${m + 1}/${y}`;
        const isMorningBusy = (type1 !== "empty");

        const morningBadge = `
          <div class="summary-slot-chip ${isMorningBusy ? status1.bgClass : 'is-empty'}">
            <span class="slot-cat-icon">${status1.icon}</span>
            <span class="slot-cat-name">${status1.text}</span>
          </div>
        `;

        const afternoonBadge = status2 ? `
          <div class="summary-slot-chip ${status2.bgClass}">
            <span class="slot-cat-icon">${status2.icon}</span>
            <span class="slot-cat-name">${status2.text}</span>
          </div>
        ` : `
          <div class="summary-slot-chip is-none">
            <span class="slot-cat-icon">—</span>
            <span class="slot-cat-name">${t('opt_none_short') || t('opt_none')}</span>
          </div>
        `;

        container.innerHTML = `
          <div class="summary-day-view">
            <div class="summary-day-banner">
              <div class="summary-date-info">
                <span class="summary-day-title">📅 ${dayOfWeek}, ${formattedDate}</span>
                ${holidayName ? `<span class="summary-holiday-badge">🎌 ${escapeHtml(holidayName)}</span>` : ''}
              </div>
              <span class="summary-today-badge">${t('today')}</span>
            </div>

            <div class="summary-day-slots">
              <div class="summary-slot-card morning">
                <div class="summary-slot-header">
                  <span>☀️ ${t('slot_morning')}</span>
                </div>
                <div class="summary-slot-content">
                  ${morningBadge}
                </div>
              </div>
              <div class="summary-slot-card afternoon">
                <div class="summary-slot-header">
                  <span>🌤️ ${t('slot_afternoon')}</span>
                </div>
                <div class="summary-slot-content">
                  ${afternoonBadge}
                </div>
              </div>
            </div>

            <div class="summary-note-box">
              <span class="summary-note-label">📝 ${t('note_label')}:</span>
              <span class="summary-note-text">${note ? escapeHtml(note) : `<span class="summary-note-empty">${t('summary_no_notes')}</span>`}</span>
            </div>

            <div class="summary-actions-bar">
              <button class="summary-btn primary" onclick="openModal('${todayKey}', ${y}, ${m}, ${d})">
                ${t('btn_edit_today')}
              </button>
              <button class="summary-btn secondary" onclick="goToToday()">
                ${t('btn_scroll_today')}
              </button>
            </div>
          </div>
        `;
      },

      /* 2. Tóm tắt Trong Tuần */
      renderWeek(container) {
        const now = new Date();
        const dayOfWeek = now.getDay();
        const diffToMon = (dayOfWeek + 6) % 7;
        const monday = new Date(now);
        monday.setDate(now.getDate() - diffToMon);
        monday.setHours(0, 0, 0, 0);

        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        const dict = I18N[currentLang] || I18N.vi;
        const weekdays = dict.weekdays;

        const days = [];
        const catCounts = {};
        let totalBusySlots = 0;
        let totalFreeDays = 0;

        for (let i = 0; i < 7; i++) {
          const dObj = new Date(monday);
          dObj.setDate(monday.getDate() + i);
          const dy = dObj.getFullYear();
          const dm = dObj.getMonth();
          const dd = dObj.getDate();
          const dateKey = formatDateKey(dy, dm, dd);
          const rawData = eventsData[dateKey] || { type: "empty", note: "" };
          const t1 = rawData.type1 || rawData.type || "empty";
          const t2 = rawData.type2 || "none";
          const note = rawData.note || "";
          const holidayName = getJapanHolidayName(dy, dm, dd);

          let dayBusy = false;
          if (t1 !== "empty") {
            catCounts[t1] = (catCounts[t1] || 0) + 1;
            totalBusySlots++;
            dayBusy = true;
          }
          if (t2 !== "none" && t2 !== "empty") {
            catCounts[t2] = (catCounts[t2] || 0) + 1;
            totalBusySlots++;
            dayBusy = true;
          }
          if (!dayBusy) {
            totalFreeDays++;
          }

          const isToday = (dateKey === formatDateKey(now.getFullYear(), now.getMonth(), now.getDate()));
          const dOfWeekIdx = dObj.getDay();

          days.push({
            dObj, dy, dm, dd, dateKey, t1, t2, note, holidayName, isToday, dOfWeekIdx
          });
        }

        const monStr = `${String(monday.getDate()).padStart(2, '0')}/${String(monday.getMonth() + 1).padStart(2, '0')}`;
        const sunStr = `${String(sunday.getDate()).padStart(2, '0')}/${String(sunday.getMonth() + 1).padStart(2, '0')}`;
        const weekRangeText = `${monStr} - ${sunStr}`;

        let catPillsHtml = "";
        for (let c in catCounts) {
          const s = statusMap[c] || statusMap.empty;
          catPillsHtml += `
            <span class="summary-pill-chip ${s.bgClass}">
              <span>${s.icon}</span> ${s.text} (${catCounts[c]})
            </span>
          `;
        }
        if (!catPillsHtml) {
          catPillsHtml = `<span class="summary-note-empty">${t('summary_empty_day')}</span>`;
        }

        let stripHtml = "";
        days.forEach(item => {
          const s1 = statusMap[item.t1] || statusMap.empty;
          const s2 = (item.t2 !== "none" && statusMap[item.t2]) ? statusMap[item.t2] : null;
          const isSun = (item.dOfWeekIdx === 0);
          const isSat = (item.dOfWeekIdx === 6);
          let dayTitleClass = "swd-weekday";
          if (isSun || item.holidayName) dayTitleClass += " sunday";
          else if (isSat) dayTitleClass += " saturday";

          stripHtml += `
            <div class="summary-week-day ${item.isToday ? 'is-today' : ''}" onclick="goToDay('${item.dateKey}', ${item.dy}, ${item.dm}, ${item.dd})" title="${escapeHtml(item.note || '')}">
              <div class="${dayTitleClass}">${weekdays[item.dOfWeekIdx]}</div>
              <div class="swd-date">${String(item.dd).padStart(2, '0')}/${String(item.dm + 1).padStart(2, '0')}</div>
              <div class="swd-slots">
                <div class="swd-slot-pill ${item.t1 === 'empty' ? 'is-empty' : s1.bgClass}" title="${t('slot_morning')}: ${s1.text}">
                  <span>${s1.icon}</span>
                </div>
                <div class="swd-slot-pill ${s2 ? s2.bgClass : 'is-none'}" title="${t('slot_afternoon')}: ${s2 ? s2.text : '—'}">
                  <span>${s2 ? s2.icon : '—'}</span>
                </div>
              </div>
              ${item.note ? `<span class="swd-note-icon" title="${escapeHtml(item.note)}">📝</span>` : ''}
              ${item.isToday ? `<span class="swd-today-dot"></span>` : ''}
            </div>
          `;
        });

        container.innerHTML = `
          <div class="summary-week-view">
            <div class="summary-week-banner">
              <div class="summary-week-title">
                <span>📅 ${t('tab_week')}: <strong>${weekRangeText}</strong></span>
              </div>
              <div class="summary-week-stats">
                <span class="stat-pill-highlight">🎯 ${totalBusySlots} ${t('summary_total_active')}</span>
                <span class="stat-pill-sub">☕ ${totalFreeDays} ${t('summary_total_free')}</span>
              </div>
            </div>

            <div class="summary-pill-group">
              ${catPillsHtml}
            </div>

            <div class="summary-week-strip">
              ${stripHtml}
            </div>
          </div>
        `;
      },

      /* 3. Tóm tắt Trong Tháng */
      renderMonth(container) {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const dict = I18N[currentLang] || I18N.vi;

        let totalBusySlots = 0;
        let totalFreeDays = 0;
        let totalHolidays = 0;
        const catCounts = {};
        const notesList = [];

        for (let day = 1; day <= totalDays; day++) {
          const dateKey = formatDateKey(year, month, day);
          const rawData = eventsData[dateKey] || { type: "empty", note: "" };
          const t1 = rawData.type1 || rawData.type || "empty";
          const t2 = rawData.type2 || "none";
          const note = (rawData.note || "").trim();
          const holidayName = getJapanHolidayName(year, month, day);

          if (holidayName) totalHolidays++;

          let dayBusy = false;
          if (t1 !== "empty") {
            catCounts[t1] = (catCounts[t1] || 0) + 1;
            totalBusySlots++;
            dayBusy = true;
          }
          if (t2 !== "none" && t2 !== "empty") {
            catCounts[t2] = (catCounts[t2] || 0) + 1;
            totalBusySlots++;
            dayBusy = true;
          }
          if (!dayBusy) {
            totalFreeDays++;
          }

          if (note) {
            notesList.push({ day, dateKey, note, t1, t2 });
          }
        }

        const totalSlots = totalDays * 2;
        let distributionHtml = "";
        const sortedCats = Object.keys(catCounts).sort((a, b) => catCounts[b] - catCounts[a]);

        if (sortedCats.length > 0) {
          distributionHtml = sortedCats.map(cat => {
            const s = statusMap[cat] || statusMap.empty;
            const count = catCounts[cat];
            const pct = Math.round((count / totalSlots) * 100);
            return `
              <div class="month-dist-row">
                <div class="month-dist-label">
                  <span class="dist-icon">${s.icon}</span>
                  <span class="dist-name">${s.text}</span>
                </div>
                <div class="month-dist-bar-wrap">
                  <div class="month-dist-bar ${s.bgClass}" style="width: ${Math.max(pct, 6)}%"></div>
                </div>
                <div class="month-dist-count"><strong>${count}</strong> buổi</div>
              </div>
            `;
          }).join("");
        } else {
          distributionHtml = `<div class="summary-note-empty">${t('summary_empty_day')}</div>`;
        }

        let notesListHtml = "";
        if (notesList.length > 0) {
          notesListHtml = notesList.slice(0, 5).map(item => `
            <div class="month-note-item" onclick="goToDay('${item.dateKey}', ${year}, ${month}, ${item.day})">
              <span class="month-note-date">Ngày ${String(item.day).padStart(2, '0')}/${String(month + 1).padStart(2, '0')}:</span>
              <span class="month-note-content">${escapeHtml(item.note)}</span>
            </div>
          `).join("");
          if (notesList.length > 5) {
            notesListHtml += `<div class="month-note-more">và ${notesList.length - 5} ghi chú khác trong tháng...</div>`;
          }
        }

        const monthLabel = dict.format_month ? dict.format_month(year, month) : `Tháng ${month + 1}/${year}`;

        container.innerHTML = `
          <div class="summary-month-view">
            <div class="summary-month-header">
              <span class="summary-month-title">🗓️ <strong>${monthLabel}</strong></span>
            </div>

            <div class="summary-month-stats">
              <div class="month-stat-card">
                <div class="mstat-val">${totalBusySlots}</div>
                <div class="mstat-label">📊 ${t('total_events')}</div>
              </div>
              <div class="month-stat-card">
                <div class="mstat-val">${totalFreeDays}</div>
                <div class="mstat-label">☕ ${t('total_off_days')}</div>
              </div>
              <div class="month-stat-card">
                <div class="mstat-val">${totalHolidays}</div>
                <div class="mstat-label">🎌 ${t('total_holidays')}</div>
              </div>
            </div>

            <div class="summary-section-sub">📊 Phân bổ lịch trình</div>
            <div class="month-dist-list">
              ${distributionHtml}
            </div>

            ${notesListHtml ? `
              <div class="summary-section-sub">📝 Ghi chú trong tháng (${notesList.length})</div>
              <div class="month-notes-box">
                ${notesListHtml}
              </div>
            ` : ''}
          </div>
        `;
      }
    };

    /* ========================================================
       CHẾ ĐỘ XEM: TIMELINE & GRID MONTH VIEW
       ======================================================== */
    function switchView(mode) {
      currentView = mode;
      localStorage.setItem("app_view", mode);
      renderCurrentView();
      setTimeout(() => {
        scrollToToday(false);
      }, 100);
    }

    function renderCurrentView() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const dict = I18N[currentLang] || I18N.vi;
      document.getElementById("currentMonthLabel").innerText = dict.format_month(year, month);

      if (currentView === "grid") {
        document.getElementById("timelineContainer").style.display = "none";
        document.getElementById("gridCalendarContainer").style.display = "block";
        document.getElementById("viewTimelineBtn").classList.remove("active");
        document.getElementById("viewGridBtn").classList.add("active");
        renderGridView();
      } else {
        document.getElementById("timelineContainer").style.display = "flex";
        document.getElementById("gridCalendarContainer").style.display = "none";
        document.getElementById("viewTimelineBtn").classList.add("active");
        document.getElementById("viewGridBtn").classList.remove("active");
        renderTimeline();
      }
      renderCounters();
      ScheduleSummary.render();
    }

    /* Hiển thị Dạng Danh sách (Timeline View - Bố cục Sáng/Chiều & Ghi chú) */
    function renderTimeline() {
      const container = document.getElementById("timelineContainer");
      container.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const searchQuery = document.getElementById("searchInput").value.toLowerCase();
      const filterType = document.getElementById("filterStatus").value;

      const now = new Date();
      const todayStr = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());
      const dict = I18N[currentLang] || I18N.vi;
      const weekdays = dict.weekdays;

      for (let day = 1; day <= totalDays; day++) {
        const dateKey = formatDateKey(year, month, day);
        const rawData = eventsData[dateKey] || { type: "empty", note: "" };
        
        const type1 = rawData.type1 || rawData.type || "empty";
        const type2 = rawData.type2 || "none";
        const note = rawData.note || "";

        const dateObj = new Date(year, month, day);
        const dayOfWeekIndex = dateObj.getDay();
        const dayOfWeek = (dict.weekdays_full && dict.weekdays_full[dayOfWeekIndex]) || weekdays[dayOfWeekIndex];
        const holidayName = getJapanHolidayName(year, month, day);

        if (filterType !== "all") {
          if (type1 !== filterType && type2 !== filterType) continue;
        }
        if (searchQuery && !note.toLowerCase().includes(searchQuery)) continue;

        const isToday = (dateKey === todayStr);
        const isSunday = (dayOfWeekIndex === 0);
        const isSaturday = (dayOfWeekIndex === 6);

        const card = document.createElement("div");
        card.id = `day-card-${dateKey}`;
        card.className = `day-card ${isToday ? "today" : ""}`;
        card.onclick = () => openModal(dateKey, year, month, day);

        const status1 = statusMap[type1] || statusMap.empty;
        const status2 = (type2 !== "none" && statusMap[type2]) ? statusMap[type2] : null;

        // Xử lý hiển thị Buổi Sáng (Mục 1)
        const isType1Empty = (type1 === "empty");
        const slot1Html = `
          <div class="slot-badge-chip ${isType1Empty ? 'is-empty' : status1.bgClass}">
            <span class="slot-cat-icon">${status1.icon}</span>
            <span class="slot-cat-name">${status1.text}</span>
          </div>
        `;

        // Xử lý hiển thị Buổi Chiều (Mục 2)
        let slot2Html = "";
        if (status2) {
          slot2Html = `
            <div class="slot-badge-chip ${status2.bgClass}">
              <span class="slot-cat-icon">${status2.icon}</span>
              <span class="slot-cat-name">${status2.text}</span>
            </div>
          `;
        } else {
          slot2Html = `
            <div class="slot-badge-chip is-none">
              <span class="slot-cat-icon">—</span>
              <span class="slot-cat-name">${t('opt_none_short') || t('opt_none')}</span>
            </div>
          `;
        }

        let weekdayClass = "day-weekday";
        let dateNumClass = "day-num-month";
        if (holidayName || isSunday) {
          weekdayClass += " sunday";
          dateNumClass += " holiday";
        } else if (isSaturday) {
          weekdayClass += " saturday";
          dateNumClass += " saturday";
        }

        const formattedDay = String(day).padStart(2, '0');
        const formattedMonth = String(month + 1).padStart(2, '0');

        card.innerHTML = `
          <div class="day-date-col">
            <div class="${weekdayClass}">${dayOfWeek}</div>
            <div class="${dateNumClass}">${formattedDay}/${formattedMonth}</div>
            ${holidayName ? `<div class="day-holiday-pill" title="${escapeHtml(holidayName)}">🎌 ${escapeHtml(holidayName)}</div>` : ''}
            ${isToday ? `<div class="today-badge-pill">${t('today')}</div>` : ''}
          </div>
          <div class="day-content-col">
            <div class="day-slots-row">
              <div class="day-slot morning">
                <div class="slot-label-bar">
                  <span>☀️ ${t('slot_morning')}</span>
                </div>
                <div class="slot-badge-wrap">
                  ${slot1Html}
                </div>
              </div>
              <div class="day-slot afternoon">
                <div class="slot-label-bar">
                  <span>🌤️ ${t('slot_afternoon')}</span>
                </div>
                <div class="slot-badge-wrap">
                  ${slot2Html}
                </div>
              </div>
            </div>
            <div class="day-notes-row">
              <span class="notes-prefix">${t('note_label')}:</span>
              <span class="notes-body">${note ? escapeHtml(note) : `<span class="notes-empty">—</span>`}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      }
    }

    /* Hiển thị Dạng Lưới tháng (Grid Month View) */
    function renderGridView() {
      const container = document.getElementById("gridCalendarContainer");
      container.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const searchQuery = document.getElementById("searchInput").value.toLowerCase();
      const filterType = document.getElementById("filterStatus").value;

      const now = new Date();
      const todayStr = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());
      const dict = I18N[currentLang] || I18N.vi;
      const weekdays = dict.weekdays; // [0: CN, 1: T2, 2: T3, 3: T4, 4: T5, 5: T6, 6: T7]

      // Thứ tự cột theo tuần làm việc: Thứ 2 -> Chủ Nhật [1, 2, 3, 4, 5, 6, 0]
      const colOrder = [1, 2, 3, 4, 5, 6, 0];

      // Tiêu đề các thứ trong tuần
      const headerRow = document.createElement("div");
      headerRow.className = "grid-weekdays-header";
      colOrder.forEach(idx => {
        const titleEl = document.createElement("div");
        titleEl.className = "grid-weekday-title" + (idx === 6 ? " sat" : idx === 0 ? " sun" : "");
        titleEl.innerText = weekdays[idx];
        headerRow.appendChild(titleEl);
      });
      container.appendChild(headerRow);

      // Thân lưới ngày
      const cellsContainer = document.createElement("div");
      cellsContainer.className = "grid-cells-container";

      // Tính ngày bắt đầu: Thứ của ngày mùng 1
      const firstDayOfWeek = new Date(year, month, 1).getDay(); // 0-6
      const startOffset = (firstDayOfWeek + 6) % 7; // Số ô trống cần đệm trước ngày 1

      // Các ngày đệm của tháng trước
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = 0; i < startOffset; i++) {
        const prevDayNum = prevMonthLastDay - startOffset + i + 1;
        const emptyCell = document.createElement("div");
        emptyCell.className = "grid-day-cell other-month";
        emptyCell.innerHTML = `<div class="grid-day-header"><span class="grid-day-num">${prevDayNum}</span></div>`;
        cellsContainer.appendChild(emptyCell);
      }

      // Các ngày trong tháng hiện tại
      for (let day = 1; day <= totalDays; day++) {
        const dateKey = formatDateKey(year, month, day);
        const rawData = eventsData[dateKey] || { type: "empty", note: "" };
        const type1 = rawData.type1 || rawData.type || "empty";
        const type2 = rawData.type2 || "none";
        const note = rawData.note || "";

        const dayOfWeekIndex = new Date(year, month, day).getDay();
        const holidayName = getJapanHolidayName(year, month, day);

        const status1 = statusMap[type1] || statusMap.empty;
        const status2 = (type2 !== "none" && statusMap[type2]) ? statusMap[type2] : null;

        // Kiểm tra bộ lọc
        let isDimmed = false;
        if (filterType !== "all") {
          if (type1 !== filterType && type2 !== filterType) isDimmed = true;
        }
        if (searchQuery && !note.toLowerCase().includes(searchQuery)) isDimmed = true;

        const cell = document.createElement("div");
        let cellClass = "grid-day-cell";
        if (dateKey === todayStr) cellClass += " today";
        if (isDimmed) cellClass += " dimmed";
        cell.className = cellClass;
        cell.onclick = () => openModal(dateKey, year, month, day);

        let numClass = "grid-day-num";
        if (holidayName) numClass += " holiday";
        else if (dayOfWeekIndex === 0) numClass += " sunday";
        else if (dayOfWeekIndex === 6) numClass += " saturday";

        let eventsHtml = "";
        if (type1 !== "empty") {
          eventsHtml += `
            <div class="grid-badge ${status1.bgClass}">
              <span>${status1.icon}</span>
              <span class="badge-text">${status1.text}</span>
            </div>
          `;
        }
        if (status2) {
          eventsHtml += `
            <div class="grid-badge ${status2.bgClass}">
              <span>${status2.icon}</span>
              <span class="badge-text">${status2.text}</span>
            </div>
          `;
        }

        cell.innerHTML = `
          <div class="grid-day-header">
            <span class="${numClass}">${day}</span>
            ${holidayName ? `<span class="grid-holiday-tag" title="${escapeHtml(holidayName)}">🎌 ${escapeHtml(holidayName)}</span>` : ""}
          </div>
          <div class="grid-events">
            ${eventsHtml}
            ${note ? `<div class="grid-note-preview">📝 ${escapeHtml(note)}</div>` : ""}
          </div>
        `;
        cellsContainer.appendChild(cell);
      }

      // Đệm các ô sau tháng này để đủ hàng hoàn chỉnh
      const remainingCells = (7 - ((startOffset + totalDays) % 7)) % 7;
      for (let i = 1; i <= remainingCells; i++) {
        const nextCell = document.createElement("div");
        nextCell.className = "grid-day-cell other-month";
        nextCell.innerHTML = `<div class="grid-day-header"><span class="grid-day-num">${i}</span></div>`;
        cellsContainer.appendChild(nextCell);
      }

      container.appendChild(cellsContainer);
    }

    /* Modal Chi tiết ngày */
    function openModal(dateKey, y, m, d) {
      selectedDateKey = dateKey;
      const dict = I18N[currentLang] || I18N.vi;
      document.getElementById("modalDateLabel").innerText = dict.format_date_label(y, m, d);
      const rawData = eventsData[dateKey] || { type: "empty", note: "" };
      
      document.getElementById("editType1").value = rawData.type1 || rawData.type || "empty";
      document.getElementById("editType2").value = rawData.type2 || "none";
      document.getElementById("editNote").value = rawData.note || "";
      document.getElementById("editModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("editModal").classList.remove("active");
    }

    function saveDayData() {
      if (!selectedDateKey) return;
      const type1 = document.getElementById("editType1").value;
      const type2 = document.getElementById("editType2").value;
      const note = document.getElementById("editNote").value.trim();

      if (type1 === "empty" && type2 === "none" && !note) {
        eventsData[selectedDateKey] = { type1: "empty", type2: "none", note: "" };
      } else {
        eventsData[selectedDateKey] = { type1, type2, note };
      }

      saveToStorage();
      closeModal();
      renderCurrentView();
    }

    function deleteDayData() {
      if (!selectedDateKey) return;
      if (confirm(t('confirm_del_day'))) {
        eventsData[selectedDateKey] = { type1: "empty", type2: "none", note: "" };
        saveToStorage();
        closeModal();
        renderCurrentView();
      }
    }

    /* Modal Thêm Mục Mới */
    function openAddCategoryModal() {
      toggleMenu();
      document.getElementById("addCategoryModal").classList.add("active");
    }
    function closeAddCategoryModal() {
      document.getElementById("addCategoryModal").classList.remove("active");
    }
    function saveCategory() {
      const name = document.getElementById("newCatName").value.trim();
      const icon = document.getElementById("newCatIcon").value.trim();
      const color = document.getElementById("newCatColor").value;

      if (!name || !icon) {
        alert(t('alert_fill_cat'));
        return;
      }

      const id = "custom_" + Date.now();
      customCategories[id] = { text: name, icon: icon, color: color };

      saveCategoriesToStorage();
      buildStatusMap();
      renderDynamicStyles();
      renderAllSelects();
      renderCurrentView();
      
      document.getElementById("newCatName").value = "";
      document.getElementById("newCatIcon").value = "";
      closeAddCategoryModal();
      alert(t('cat_created_msg', { name: name }));
    }

    /* Modal Thêm Hàng Loạt */
    function toggleBatchMode() {
      const mode = document.getElementById("batchMode").value;
      if (mode === "range") {
        document.getElementById("batchRangeSection").style.display = "block";
        document.getElementById("batchSpecificSection").style.display = "none";
      } else {
        document.getElementById("batchRangeSection").style.display = "none";
        document.getElementById("batchSpecificSection").style.display = "block";
      }
    }

    function openBatchModal() {
      toggleMenu();
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = formatDateKey(year, month, 1);
      const lastDay = formatDateKey(year, month, new Date(year, month + 1, 0).getDate());
      
      document.getElementById("batchStartDate").value = firstDay;
      document.getElementById("batchEndDate").value = lastDay;
      document.getElementById("batchSpecificMonthLabel").innerText = document.getElementById("currentMonthLabel").innerText;
      document.getElementById("batchModal").classList.add("active");
    }

    function closeBatchModal() {
      document.getElementById("batchModal").classList.remove("active");
    }

    function applyBatchSchedule() {
      const mode = document.getElementById("batchMode").value;
      const type1 = document.getElementById("batchType1").value;
      const type2 = document.getElementById("batchType2").value;
      const note = document.getElementById("batchNote").value.trim();
      const skipHolidays = true; // Luôn tự động bỏ qua ngày lễ Nhật Bản

      let count = 0;

      if (mode === "range") {
        const startVal = document.getElementById("batchStartDate").value;
        const endVal = document.getElementById("batchEndDate").value;
        if (!startVal || !endVal) { alert(t('alert_select_dates')); return; }
        const startDate = new Date(startVal);
        const endDate = new Date(endVal);
        if (startDate > endDate) { alert(t('alert_date_invalid')); return; }

        const selectedWeekdays = [];
        for (let i = 0; i <= 6; i++) {
          if (document.getElementById(`w${i}`).checked) selectedWeekdays.push(i);
        }

        let curr = new Date(startDate);
        while (curr <= endDate) {
          const y = curr.getFullYear();
          const m = curr.getMonth();
          const d = curr.getDate();
          const dayOfWeek = curr.getDay();

          if (selectedWeekdays.includes(dayOfWeek)) {
            const holidayName = getJapanHolidayName(y, m, d);
            if (skipHolidays && holidayName) {
              const dateKey = formatDateKey(y, m, d);
              eventsData[dateKey] = { type1: "empty", type2: "none", note: "" };
            } else {
              const dateKey = formatDateKey(y, m, d);
              if (type1 === "empty" && type2 === "none" && !note) {
                eventsData[dateKey] = { type1: "empty", type2: "none", note: "" };
              } else {
                eventsData[dateKey] = { type1, type2, note };
              }
              count++;
            }
          }
          curr.setDate(curr.getDate() + 1);
        }
      } else {
        // Specific dates
        const datesStr = document.getElementById("batchSpecificDates").value;
        if (!datesStr) { alert(t('alert_specific_invalid')); return; }
        
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
        
        const daysArr = datesStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n >= 1 && n <= totalDaysInMonth);
        if (daysArr.length === 0) { alert(t('alert_specific_invalid')); return; }

        for (let d of daysArr) {
          const holidayName = getJapanHolidayName(year, month, d);
          if (skipHolidays && holidayName) {
            const dateKey = formatDateKey(year, month, d);
            eventsData[dateKey] = { type1: "empty", type2: "none", note: "" };
          } else {
            const dateKey = formatDateKey(year, month, d);
            if (type1 === "empty" && type2 === "none" && !note) {
              eventsData[dateKey] = { type1: "empty", type2: "none", note: "" };
            } else {
              eventsData[dateKey] = { type1, type2, note };
            }
            count++;
          }
        }
      }

      saveToStorage();
      closeBatchModal();
      renderCurrentView();
      alert(t('batch_added_msg', { count: count }));
    }

    /* Modal Xóa Hàng Loạt */
    function openBatchDeleteModal() {
      toggleMenu();
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = formatDateKey(year, month, 1);
      const lastDay = formatDateKey(year, month, new Date(year, month + 1, 0).getDate());
      
      document.getElementById("batchDelStartDate").value = firstDay;
      document.getElementById("batchDelEndDate").value = lastDay;
      document.getElementById("batchDeleteModal").classList.add("active");
    }

    function closeBatchDeleteModal() {
      document.getElementById("batchDeleteModal").classList.remove("active");
    }

    function executeBatchDelete() {
      const startVal = document.getElementById("batchDelStartDate").value;
      const endVal = document.getElementById("batchDelEndDate").value;

      if (!startVal || !endVal) {
        alert(t('alert_select_dates'));
        return;
      }

      const startDate = new Date(startVal);
      const endDate = new Date(endVal);

      if (startDate > endDate) {
        alert(t('alert_date_invalid'));
        return;
      }

      if (!confirm(t('confirm_batch_del'))) {
        return;
      }

      const selectedWeekdays = [];
      for (let i = 0; i <= 6; i++) {
        if (document.getElementById(`dw${i}`).checked) {
          selectedWeekdays.push(i);
        }
      }

      let curr = new Date(startDate);
      let count = 0;

      while (curr <= endDate) {
        const y = curr.getFullYear();
        const m = curr.getMonth();
        const d = curr.getDate();
        const dayOfWeek = curr.getDay();

        if (selectedWeekdays.includes(dayOfWeek)) {
          const dateKey = formatDateKey(y, m, d);
          if (eventsData[dateKey]) {
            eventsData[dateKey] = { type1: "empty", type2: "none", note: "" };
            count++;
          }
        }
        curr.setDate(curr.getDate() + 1);
      }

      saveToStorage();
      closeBatchDeleteModal();
      renderCurrentView();
      alert(t('batch_deleted_msg', { count: count }));
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.innerText = text;
      return div.innerHTML;
    }

    /* Xuất File JSON */
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(eventsData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `calendar_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          eventsData = JSON.parse(e.target.result);
          saveToStorage();
          renderCurrentView();
          alert(t('import_success'));
        } catch (err) {
          alert(t('import_error'));
        }
      };
      reader.readAsText(file);
    }

    /* Xuất file PDF */
    function exportPDF() {
      toggleMenu();
      setTimeout(() => {
        const element = document.getElementById('pdfWrapper');
        const monthLabel = document.getElementById('currentMonthLabel').innerText.replace(/[/ ]/g, '-');
        
        const isGrid = (currentView === "grid");
        const opt = {
          margin:       [8, 5, 8, 5],
          filename:     `Lich_${monthLabel}.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
          jsPDF:        { unit: 'mm', format: 'a4', orientation: isGrid ? 'landscape' : 'portrait' },
          pagebreak:    { mode: 'css' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
          console.log("Xuất PDF thành công!");
        });
      }, 300);
    }

    function requestNotification() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            new Notification(t('app_title'), { body: t('notif_enabled') });
          }
        });
      }
    }

    // Hiển thị ban đầu
    ScheduleSummary.init();
    renderCurrentView();
    setTimeout(() => {
      scrollToToday(true);
    }, 250);
  </script>
